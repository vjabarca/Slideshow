name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest   # exe must be built on Windows

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name MyApp --add-data "config_slideshow.yml;." Update_Slideshow.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-exe
          path: dist/MyApp.exe

