

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your Python version

    - name: Install dependencies
      run: |
        pip install pyinstaller argparse yaml subprocess os shutil time sys # Add any other dependencies your script needs
    
    - name: Build EXE
      run: pyinstaller --onefile --add-data "config_slideshow.yml;." Update_Slideshow.py

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/main.exe




name: Build Windows EXE

on:
  push:
    branches: [ "main" ] # Triggers the build whenever you push to main
  workflow_dispatch:     # Allows you to manually trigger the build from GitHub

jobs:
  build:
    runs-on: windows-latest # Required to build a Windows .exe natively

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # If you have external packages, uncomment the line below:
        # pip install -r requirements.txt
        pip install argparse
        pip install pyyaml
        pip install subprocess
        pip install os
        pip install shutil
        pip install time
        pip install sys
        pip install pyinstaller

    - name: Build executable
      run: |
        # Replace 'your_script.py' with the name of your main Python file
        # The '--collect-data yaml' flag ensures PyYAML's metadata is bundled correctly
        pyinstaller --onefile --collect-data yaml your_script.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/*.exe  # PyInstaller outputs the final EXE into the 'dist' folder
        *.yml
